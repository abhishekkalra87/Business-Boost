kind = "web"
previewPath = "/"
title = "TalentForge Consulting"
description = "A full-stack business consulting website for NexZenta (TalentForge Consulting) with service pages, contact form, consultation booking, admin panel, and email notifications."
version = "1.0.0"
id = "artifacts/talentforge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23570

[services.development]
run = "pnpm --filter @workspace/talentforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/talentforge", "run", "build" ]
serve = "static"
publicDir = "artifacts/talentforge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23570"
BASE_PATH = "/"
