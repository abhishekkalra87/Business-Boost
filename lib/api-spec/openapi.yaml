openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: academy
    description: AI Academy enquiry operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai-academy/enquiries:
    post:
      operationId: submitAcademyEnquiry
      tags: [academy]
      summary: Submit an AI Academy enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademyEnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademyEnquiryResponse"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many enquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Enquiry could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AcademyEnquiryInput:
      type: object
      additionalProperties: false
      required: [fullName, email, enquiryType, privacyConsent]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        enquiryType:
          type: string
          enum: [individual, corporate, trainer]
        courseInterest:
          type: string
          enum: [ai-hr, project-management, business-automation]
        company:
          type: string
          maxLength: 160
        teamSize:
          type: string
          maxLength: 80
        trainingNeeds:
          type: string
          maxLength: 3000
        linkedinProfile:
          type: string
          format: uri
          maxLength: 500
        expertise:
          type: string
          maxLength: 300
        teachingExperience:
          type: string
          maxLength: 2000
        privacyConsent:
          type: boolean
        website:
          type: string
          maxLength: 300
    AcademyEnquiryResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

